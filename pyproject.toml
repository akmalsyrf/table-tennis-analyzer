[project]
name = "table-tennis-analyzer-poc"
version = "0.1.0"
description = "POC FastAPI + CV pipeline for table tennis videos"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "opencv-python",
  "ultralytics",
  "numpy",
  "python-multipart",
  "jinja2",
]

[tool.uvicorn]
factory = true

